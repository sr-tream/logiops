// Merge these hooks into your existing keyboard entry in /etc/logid.cfg.
// Set departure_mode to "link_state" in /etc/logi-host-switch.json.
devices: (
    {
        name: "MX Keys S";
        on_connect: {
            command: "/usr/local/lib/logi-host-switch/run-event.sh";
            args: ["connected"];
        };
        on_disconnect: {
            command: "/usr/local/lib/logi-host-switch/run-event.sh";
            args: ["disconnected"];
        };
    }
);
